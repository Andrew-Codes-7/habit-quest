<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Quest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Habit Quest</title>
<style>
:root{
  --bg:#0b1120; --bg2:#0f172a; --card:#162033; --card2:#1d2940; --line:#26324d;
  --text:#e8edf7; --muted:#8a97b3; --dim:#5b6785;
  --accent:#22c55e; --indigo:#6366f1; --gem:#38bdf8; --fire:#f97316; --gold:#fbbf24; --ice:#7dd3fc; --red:#ef4444;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--indigo)}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 110px)}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;padding:8px 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.me-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--line);min-width:0}
.me-chip b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.me-chip .chev{color:var(--muted);font-size:12px}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill .e{font-size:16px;line-height:1}
.pill.fire.off{filter:grayscale(1);opacity:.7}
.pill.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* avatar */
.av{--c:#6366f1;position:relative;display:inline-grid;place-items:center;border-radius:50%;background:var(--c);width:38px;height:38px;font-size:20px;font-weight:800;color:#fff;flex:none}
.av.lg{width:96px;height:96px;font-size:52px}
.av.md{width:56px;height:56px;font-size:30px}
.av.sm{width:30px;height:30px;font-size:16px}
.av.emo{background:color-mix(in srgb,var(--c) 30%,#1b2540)}
.av::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
.av.f-gold::after{border:3px solid var(--gold);box-shadow:0 0 12px #fbbf2466}
.av.f-ice::after{border:3px solid var(--ice);box-shadow:0 0 14px #7dd3fc88,inset 0 0 8px #7dd3fc55}
.av.f-fire::after{border:3px solid #fb923c;animation:fireglow 1.2s ease-in-out infinite alternate}
@keyframes fireglow{from{box-shadow:0 0 6px #f97316,0 -2px 12px #facc15}to{box-shadow:0 0 16px #ef4444,0 -6px 22px #f97316}}
.av.f-rainbow::after{inset:-5px;padding:3px;background:conic-gradient(#ef4444,#f59e0b,#84cc16,#06b6d4,#6366f1,#ec4899,#ef4444);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);width:min(528px,calc(100% - 24px));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:28px;background:rgba(22,32,51,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.07);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:22px;background:linear-gradient(180deg,#22c55e33,#22c55e1a);border:1px solid #22c55e44;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;font-weight:700;color:var(--muted);transition:color .2s}
.tabs button svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tabs button.on{color:#fff}
.tabs button.on svg{transform:translateY(-1px) scale(1.1);color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--safe-b) + 96px);z-index:25;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;box-shadow:0 8px 24px #16a34a66;transition:transform .2s}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px;color:#fff}

/* ---------- common ---------- */
h2{font-size:22px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:13px;background:var(--card2);color:var(--muted);padding:2px 9px;border-radius:999px}
h2 .right{margin-left:auto;font-size:14px;color:#818cf8;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:800;background:var(--card2);border:1px solid var(--line);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#6d70f5,#5457e6);border:0;color:#fff;box-shadow:0 5px 0 #3b3eb8}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #3b3eb8}
.btn.green{background:linear-gradient(180deg,#2bd46a,#1fae54);border:0;color:#fff;box-shadow:0 5px 0 #15803d}
.btn.green:active{transform:translateY(3px);box-shadow:0 2px 0 #15803d}
.btn.danger{color:#fca5a5;border-color:#7f1d1d}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.enter>*{animation:rise .45s cubic-bezier(.2,.9,.3,1.2) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- today ---------- */
.date-row{display:flex;align-items:center;gap:14px;margin-top:6px}
.date-badge{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;box-shadow:0 6px 20px #22c55e44}
.date-row .t1{font-size:24px;font-weight:800}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:18px 0 4px;border-top:1px solid var(--line);padding-top:12px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.week .dw{font-size:12px;color:var(--muted);font-weight:700}
.week .dn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:16px}
.week .dn svg{position:absolute;inset:0;transform:rotate(-90deg)}
.week button.sel .dn{background:var(--accent);color:#fff}
.week button.sel .dw{color:var(--accent)}
.week button.fut{opacity:.4}
.week .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.week .dot.on{background:var(--fire)}
.week .dot.frz{background:var(--ice)}

.progress{margin:14px 0 4px;padding:14px 16px}
.progress .bar{height:14px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:10px;position:relative}
.progress .bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.progress .bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}

.risk{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,#7c2d1233,#f9731622);border:1px solid #f9731655;font-weight:700}
.risk .e{font-size:26px;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}

.habit{--c:#22c55e;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;margin-bottom:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;transition:background .3s,border-color .3s}
.habit.done{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.habit .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.habit .nm{font-weight:700;font-size:17px}
.habit .sub{font-size:13px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.habit .sub .st{color:var(--fire);font-weight:700}
.habit .info{flex:1;min-width:0}
.chk{position:relative;width:62px;height:62px;border-radius:18px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg2);transition:transform .15s,background .25s,border-color .25s}
.chk:active{transform:scale(.88)}
.chk svg.tick{width:30px;height:30px;color:var(--dim)}
.chk svg.tick path{stroke-dasharray:30;stroke-dashoffset:0}
.habit.done .chk{background:var(--c);border-color:var(--c);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.habit.done .chk svg.tick{color:#fff}
.habit.pop .chk{animation:chkpop .5s cubic-bezier(.3,1.8,.5,1)}
.habit.pop .chk svg.tick path{animation:draw .35s ease-out}
@keyframes chkpop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.habit.pop::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);animation:shine .7s ease-out forwards}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.chk .ring{position:absolute;inset:-2px;transform:rotate(-90deg)}
.chk .cnt{font-weight:900;font-size:16px;color:var(--muted)}
.habit.part .chk .cnt{color:#fff}
.minus{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--muted);flex:none;font-weight:900}
.wiggle{animation:wig .4s}
@keyframes wig{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:6px}

.chest-card{display:flex;align-items:center;gap:14px;padding:16px;margin:4px 0 14px;border-radius:var(--r);background:linear-gradient(120deg,#78350f,#b45309 50%,#f59e0b);box-shadow:0 8px 28px #f59e0b44;font-weight:800;color:#fff;width:100%;text-align:left;animation:rise .5s both}
.chest-card .e{font-size:40px;animation:chestbob 1.4s ease-in-out infinite}
@keyframes chestbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}

/* ---------- habits tab / heatmap ---------- */
.hcard{margin-bottom:14px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.hcard .hd{display:flex;align-items:center;gap:10px}
.hcard .hd .e{font-size:24px}
.hcard .hd b{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#6366f122;color:#a5b4fc}
.stats{display:flex;gap:16px;margin:12px 0 10px;font-size:15px;color:var(--muted)}
.stats b{color:var(--text)}
.grid{display:block;width:100%;height:auto;overflow:visible}
.grid text{font-size:11px;fill:var(--muted);font-family:inherit}
.overall .stats{gap:12px;font-size:14px}
.overall .stats span{white-space:nowrap}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.overall{background:linear-gradient(180deg,#0f1b3d,var(--card));border-color:#1e3a8a}
.overall .stats{margin-top:6px}
.rbtn{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:14px;color:#cbd5e1;flex:none}
.rbtn[disabled]{opacity:.25;pointer-events:none}
.hcard.reo{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.hcard.reo .hd{flex:1;min-width:0}
.hcard.moved{animation:moved .4s ease-out}
@keyframes moved{0%{box-shadow:0 0 0 2px var(--indigo)}100%{box-shadow:0 0 0 0 transparent}}
.arch{opacity:.6}

/* ---------- family ---------- */
.fam{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);position:relative;text-align:center}
.fp.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fp .ringwrap{position:relative;width:84px;height:84px;display:grid;place-items:center}
.fp .ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.fp .nm{font-weight:800}
.fp .mini{display:flex;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.fp .crown{position:absolute;top:8px;right:10px;font-size:18px}
.quest{padding:16px;margin-top:4px;background:linear-gradient(135deg,#312e81,#1e1b4b);border-color:#4338ca}
.quest .bar{height:16px;border-radius:999px;background:#0b1120aa;overflow:hidden;margin:10px 0 6px;position:relative}
.quest .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#a78bfa,#f472b6);border-radius:999px;transition:width .8s}
.lb{display:flex;flex-direction:column;gap:8px}
.lb .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lb .pos{width:26px;text-align:center;font-weight:900;font-size:18px}
.lb .b{flex:1;height:10px;border-radius:9px;background:var(--card2);overflow:hidden}
.lb .b i{display:block;height:100%;border-radius:9px;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{width:0!important}}
.lb .xp{font-weight:800;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- shop ---------- */
.shop-hero{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,#0c4a6e,#0e7490);border:0}
.shop-hero .g{font-size:46px;animation:gemfloat 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 12px #38bdf888)}
@keyframes gemfloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
.shop-hero .v{font-size:34px;font-weight:900}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);position:relative;transition:transform .12s}
.item:active{transform:scale(.95)}
.item .big{font-size:34px;height:48px;display:grid;place-items:center}
.item .nm{font-size:13px;font-weight:700;text-align:center}
.item .pr{font-size:13px;font-weight:800;color:var(--gem)}
.item.own .pr{color:var(--muted)}
.item.eq{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.item.eq .pr{color:var(--accent)}
.item.poor .pr{color:var(--dim)}
.freeze-card{display:flex;align-items:center;gap:14px}
.freeze-card .big{font-size:44px}

/* ---------- me ---------- */
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px;text-align:center}
.prof .name{font-size:24px;font-weight:900}
.prof .title{color:var(--muted);font-weight:700}
.lvl{width:100%;padding:14px 16px}
.lvl .bar{height:12px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:9px;transition:width .8s}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.bdg .e{font-size:30px;height:40px;display:grid;place-items:center;border-radius:50%;width:48px;height:48px;background:radial-gradient(circle,#fbbf2433,transparent 70%)}
.bdg .n{font-size:11px;font-weight:700;line-height:1.15}
.bdg.lock .e{filter:grayscale(1) brightness(.5);background:none}
.bdg.lock .n{color:var(--dim)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;width:100%;text-align:left}
.setrow:last-child{border-bottom:0}
.switch{width:52px;height:32px;border-radius:999px;background:var(--card2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:var(--indigo)}
.switch.on::after{transform:translateX(20px)}

/* ---------- sheets & modals ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92vh;overflow:auto;z-index:51;background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 16px calc(var(--safe-b) + 20px);animation:sheetup .38s cubic-bezier(.2,.9,.3,1.1) both}
.sheet.out{animation:sheetdown .25s ease-in both}
.backdrop.out{animation:fade .25s reverse both}
@keyframes sheetup{from{transform:translate(-50%,100%)}}
@keyframes sheetdown{to{transform:translate(-50%,100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin:4px 0 14px;text-align:center}
.lbl{font-weight:700;margin:18px 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;color:#cbd5e1;transition:all .15s}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.days7 .chip{padding:10px 0;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);transition:transform .15s}
.sw.on{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px #fff;transform:scale(1.05)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:264px;overflow-y:auto;overscroll-behavior:contain;padding:2px}
.etabs{display:flex;gap:2px;overflow-x:auto;margin:10px 0 8px;scrollbar-width:none}
.etabs::-webkit-scrollbar{display:none}
.etabs button{font-size:21px;padding:6px 8px;border-radius:10px;flex:none;opacity:.55;transition:all .15s}
.etabs button.on{background:var(--card2);opacity:1}
.ecat{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.icons .none{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:16px 0;background:none}
.icons button{font-size:24px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.icons button.on{background:var(--indigo);transform:scale(1.08)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:900}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.namerow{display:flex;gap:10px;align-items:center}
.namerow .bigic{width:54px;height:54px;border-radius:16px;font-size:30px;display:grid;place-items:center;background:var(--card2);flex:none}
.tpl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);margin-bottom:8px;width:100%;text-align:left;font-weight:700}
.tpl .e{font-size:26px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.prow.on{border-color:var(--accent)}
.prow .grow{flex:1}
.prow b{display:block;font-size:17px}

.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.modal{position:relative;width:min(380px,100%);border-radius:28px;background:var(--bg2);border:1px solid var(--line);padding:28px 22px 22px;text-align:center;animation:mpop .5s cubic-bezier(.3,1.6,.5,1) both;overflow:hidden}
.modal.out{animation:mout .2s ease-in both}
@keyframes mpop{from{transform:scale(.6);opacity:0}}
@keyframes mout{to{transform:scale(.85);opacity:0}}
.modal h1{font-size:28px;margin:8px 0 6px;font-weight:900}
.modal p{color:var(--muted);margin:0 0 18px}
.modal .hero{font-size:96px;line-height:1.1;position:relative;display:inline-block}
.rays{position:absolute;left:50%;top:90px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(251,191,36,.13) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
.flame-big{font-size:110px;display:inline-block;animation:flame 1s ease-in-out infinite alternate;filter:drop-shadow(0 8px 24px #f97316aa)}
@keyframes flame{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
.streak-num{font-size:64px;font-weight:900;color:var(--fire);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 24px #f9731666}
.wk{display:flex;justify-content:center;gap:8px;margin:16px 0 20px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.wk span{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px}
.wk span.on{background:var(--fire);color:#fff;animation:mpop .5s cubic-bezier(.3,1.6,.5,1) both}
.wk span.fz{background:var(--ice)}
.reward{display:inline-flex;align-items:center;gap:6px;margin:0 4px 18px;padding:8px 14px;border-radius:999px;background:#38bdf822;color:var(--gem);font-weight:900;font-size:18px}
.reward.xp{background:#a855f722;color:#c084fc}
.chest{font-size:110px;display:inline-block;cursor:pointer;animation:chestshake 1.1s ease-in-out infinite}
@keyframes chestshake{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}85%{transform:rotate(-6deg)}95%{transform:rotate(4deg)}}
.chest.open{animation:chestopen .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes chestopen{0%{transform:scale(1)}30%{transform:scale(.8)}100%{transform:scale(1.2)}}
.lvlnum{font-size:88px;font-weight:900;background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}

/* who's playing */
.who{position:fixed;inset:0;z-index:48;background:radial-gradient(ellipse at top,#1e1b4b,var(--bg) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fade .3s both}
.who h1{font-size:30px;font-weight:900;margin:0 0 28px}
.who .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 30px;max-width:360px}
.who button{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;font-size:18px;animation:mpop .5s cubic-bezier(.3,1.6,.5,1) both}
.who button:active .av{transform:scale(.92)}
.who .av{width:104px;height:104px;font-size:56px;transition:transform .15s;border-radius:32px}
.who .av::after{border-radius:36px}
.who .sub{font-size:13px;color:var(--muted);font-weight:700}

/* toast + fx */
#toasts{position:fixed;top:calc(var(--safe-t) + 10px);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(29,41,64,.95);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:700;animation:tin .45s cubic-bezier(.3,1.5,.5,1) both;position:relative;overflow:hidden}
.toast.badge{background:linear-gradient(120deg,#422006,#78350f);border-color:#f59e0b}
.toast.badge::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);animation:shine 1.2s .3s ease-out both}
.toast.err{background:#450a0a;border-color:#991b1b}
.toast .e{font-size:28px}
.toast.out{animation:tout .3s ease-in both}
@keyframes tin{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
.fly{position:fixed;z-index:91;pointer-events:none;font-size:22px;will-change:transform}
.float{position:fixed;z-index:91;pointer-events:none;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.combo{position:fixed;left:50%;top:38%;z-index:92;transform:translateX(-50%);font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #b45309,0 8px 30px #f59e0b;pointer-events:none;animation:combo .9s cubic-bezier(.3,1.6,.5,1) forwards;white-space:nowrap}
@keyframes combo{0%{transform:translateX(-50%) scale(.3) rotate(-12deg);opacity:0}30%{transform:translateX(-50%) scale(1.2) rotate(4deg);opacity:1}70%{opacity:1}100%{transform:translateX(-50%) translateY(-40px) scale(1);opacity:0}}

.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.logo{font-size:64px;text-align:center;animation:gemfloat 2.4s ease-in-out infinite}
.brand{text-align:center;font-size:34px;font-weight:900;margin:0;background:linear-gradient(90deg,#4ade80,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}
.err-box{padding:12px 14px;border-radius:14px;background:#450a0a;border:1px solid #991b1b;color:#fecaca;font-size:14px}
.demo-bar{margin:-4px 0 4px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;background:#a855f733;color:#d8b4fe;padding:4px 0;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function tableMissing(err) {
  const m = (err && (err.message || '')) + ' ' + (err && err.code || '');
  return /42P01|PGRST205|PGRST200|does not exist|schema cache/i.test(m) && /hq_/.test(m);
}
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function all(make) {   // Supabase returns at most 1000 rows per request
  const out = [];
  for (let from = 0; ; from += 1000) {
    const data = await q(make().range(from, from + 999));
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

const Remote = {
  name: 'remote',
  async session() { const { data } = await sb.auth.getSession(); return data.session; },
  async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signOut() { await sb.auth.signOut(); },
  async load(since, ledgerSince) {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return { signedOut: true };
    const mem = await q(sb.from('household_members').select('household_id').eq('user_id', user.id).limit(1));
    if (!mem.length) return { noHousehold: true };
    const hh = mem[0].household_id;
    this.hh = hh;
    const [people, habits, logs, ledger, totals, profiles] = await Promise.all([
      q(sb.from('people').select('*').eq('household_id', hh).order('created_at')),
      q(sb.from('hq_habits').select('*').eq('household_id', hh).order('sort').order('created_at')),
      all(() => sb.from('hq_logs').select('habit_id,person_id,day,count').eq('household_id', hh).gte('day', since).order('habit_id').order('day')),
      all(() => sb.from('hq_ledger').select('id,person_id,key,kind,gems,xp,freezes,item,day').eq('household_id', hh).or(`kind.neq.check,day.gte.${ledgerSince}`).order('id')),
      q(sb.from('hq_totals').select('person_id,gems,xp,freezes').eq('household_id', hh)),
      q(sb.from('hq_profiles').select('person_id,avatar,frame,confetti').eq('household_id', hh)),
    ]);
    return { household: hh, userId: user.id, people, habits, logs, ledger, totals, profiles };
  },
  async saveHabit(h) { await q(sb.from('hq_habits').upsert({ ...h, household_id: this.hh })); },
  async saveHabits(list) { await q(sb.from('hq_habits').upsert(list.map(h => ({ ...h, household_id: this.hh })))); },
  async deleteHabit(id) { await q(sb.from('hq_habits').delete().eq('id', id)); },
  async setLog(h, day, count) {
    if (count > 0) await q(sb.from('hq_logs').upsert({ household_id: this.hh, habit_id: h.id, person_id: h.person_id, day, count, updated_at: new Date().toISOString() }, { onConflict: 'habit_id,day' }));
    else await q(sb.from('hq_logs').delete().eq('habit_id', h.id).eq('day', day));
  },
  // true = this device claimed it; false = already claimed (e.g. from another phone)
  async addLedger(row) {
    const data = await q(sb.from('hq_ledger').upsert({ ...row, household_id: this.hh }, { onConflict: 'person_id,key', ignoreDuplicates: true }).select('id'));
    return data.length > 0;
  },
  async removeLedger(pid, key) { await q(sb.from('hq_ledger').delete().eq('person_id', pid).eq('key', key)); },
  async saveProfile(p) { await q(sb.from('hq_profiles').upsert({ ...p, household_id: this.hh, updated_at: new Date().toISOString() })); },
  async addPerson(name, color) { return await q(sb.from('people').insert({ household_id: this.hh, name, color }).select().single()); },
};

const DEMO_KEY = 'hq.demo.v1';
const Demo = {
  name: 'demo',
  db: null,
  save() { LS.set(DEMO_KEY, this.db); },
  async session() { return true; },
  async signIn() {},
  async signOut() {},
  async load(since, ledgerSince) {
    this.db = LS.get(DEMO_KEY, null) || seedDemo();
    this.save();
    const d = this.db, totals = {};
    for (const r of d.ledger) {
      const t = totals[r.person_id] ||= { person_id: r.person_id, gems: 0, xp: 0, freezes: 0 };
      t.gems += r.gems; t.xp += r.xp; t.freezes += r.freezes;
    }
    return {
      household: 'demo', userId: 'demo', people: d.people, habits: d.habits,
      logs: d.logs.filter(l => l.day >= since),
      ledger: d.ledger.filter(r => r.kind !== 'check' || r.day >= ledgerSince),
      totals: Object.values(totals), profiles: d.profiles,
    };
  },
  async saveHabit(h) { const i = this.db.habits.findIndex(x => x.id === h.id); if (i >= 0) this.db.habits[i] = { ...this.db.habits[i], ...h }; else this.db.habits.push(h); this.save(); },
  async saveHabits(list) { for (const h of list) await this.saveHabit(h); },
  async deleteHabit(id) { this.db.habits = this.db.habits.filter(h => h.id !== id); this.db.logs = this.db.logs.filter(l => l.habit_id !== id); this.save(); },
  async setLog(h, day, count) {
    this.db.logs = this.db.logs.filter(l => !(l.habit_id === h.id && l.day === day));
    if (count > 0) this.db.logs.push({ habit_id: h.id, person_id: h.person_id, day, count });
    this.save();
  },
  async addLedger(row) { if (this.db.ledger.some(r => r.person_id === row.person_id && r.key === row.key)) return false; this.db.ledger.push(row); this.save(); return true; },
  async removeLedger(pid, key) { this.db.ledger = this.db.ledger.filter(r => !(r.person_id === pid && r.key === key)); this.save(); },
  async saveProfile(p) { this.db.profiles = this.db.profiles.filter(x => x.person_id !== p.person_id); this.db.profiles.push(p); this.save(); },
  async addPerson(name, color) { const p = { id: uuid(), name, color, created_at: new Date().toISOString() }; this.db.people.push(p); this.save(); return p; },
};

function seedDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const t = today(), created = new Date(parse(addDays(t, -200))).toISOString();
  const mk = (name, color) => ({ id: uuid(), name, color, created_at: created });
  const people = [mk('Andrew', '#6366f1'), mk('Liz', '#ec4899'), mk('Henley', '#10b981'), mk('Vanessa', '#f59e0b')];
  const [A, L, H, V] = people.map(p => p.id);
  let sort = 0;
  const hb = (pid, icon, name, color, extra = {}, rate = .8) => ({ id: uuid(), person_id: pid, icon, name, color, freq_type: 'daily', freq_days: [], freq_per_week: 3, target: 1, description: null, archived: false, sort: sort++, created_at: created, _rate: rate, ...extra });
  const habits = [
    hb(A, '💧', 'Morning water', '#06b6d4', {}, .9), hb(A, '🏃', 'Exercise 20–40 min', '#10b981', {}, .7), hb(A, '🦶', 'Foot routine', '#14b8a6', {}, .6), hb(A, '📚', 'Read 20 pages', '#3b82f6', { freq_type: 'weekly', freq_per_week: 4 }, .6),
    hb(L, '🧘', 'Meditate', '#8b5cf6', {}, .85), hb(L, '🥦', 'Eat veggies', '#84cc16', { target: 3 }, .75), hb(L, '🚶', '10k steps', '#3b82f6', { freq_type: 'weekdays' }, .7),
    hb(H, '🦷', 'Brush teeth', '#06b6d4', { target: 2 }, .9), hb(H, '🛏️', 'Make my bed', '#8b5cf6', {}, .75), hb(H, '📚', 'Read 15 minutes', '#3b82f6', {}, .7), hb(H, '🎹', 'Piano practice', '#ec4899', { freq_type: 'weekly', freq_per_week: 3 }, .5),
    hb(V, '🦷', 'Brush teeth', '#06b6d4', { target: 2 }, .9), hb(V, '🧹', 'Tidy my room', '#f59e0b', {}, .6), hb(V, '🐶', 'Feed the dog', '#f97316', {}, .85), hb(V, '✍️', 'Homework', '#6366f1', { freq_type: 'weekdays' }, .8),
  ];
  const logs = [], ledger = [];
  const add = (pid, key, kind, gems, xp, day, extra = {}) => ledger.push({ id: uuid(), person_id: pid, key, kind, gems, xp, freezes: 0, item: null, day, ...extra });
  // recent run of perfect-ish days so everyone has a streak going
  const streakLen = { [A]: 12, [L]: 26, [H]: 5, [V]: 9 };
  for (let i = 120; i >= 1; i--) {
    const day = addDays(t, -i);
    for (const p of people) {
      const inStreak = i <= streakLen[p.id];
      if (!inStreak && (i === streakLen[p.id] + 1 || rnd() < .3)) continue;   // an off day
      let dueAll = 0, doneAll = 0;
      for (const h of habits.filter(h => h.person_id === p.id)) {
        const due = isDueRaw(h, day);
        const ramp = Math.min(1, .45 + (180 - i) / 250);
        const hit = rnd() < (inStreak ? Math.max(h._rate, .85) : h._rate * ramp);
        if (due && h.freq_type !== 'weekly') dueAll++;
        if (h.freq_type === 'weekly' ? hit && rnd() < .6 : due && hit) {
          logs.push({ habit_id: h.id, person_id: p.id, day, count: h.target });
          add(p.id, `check:${h.id}:${day}`, 'check', GEMS_PER_HABIT, XP_PER_HABIT, day);
          if (due && h.freq_type !== 'weekly') doneAll++;
        } else if (inStreak && due && h.freq_type !== 'weekly' && doneAll === 0 && h === habits.find(x => x.person_id === p.id)) {
          logs.push({ habit_id: h.id, person_id: p.id, day, count: h.target }); doneAll++;
        }
      }
      if (dueAll && doneAll === dueAll) add(p.id, `perfect:${day}`, 'perfect', PERFECT_GEMS, PERFECT_XP, day);
    }
  }
  habits.forEach(h => delete h._rate);
  add(H, 'buy:a-dino', 'buy', -200, 0, addDays(t, -30), { item: 'a-dino' });
  add(V, 'buy:a-uni', 'buy', -150, 0, addDays(t, -20), { item: 'a-uni' });
  add(V, 'buy:rainbow', 'buy', -400, 0, addDays(t, -10), { item: 'rainbow' });
  add(L, 'buy:freeze:1', 'buy', -FREEZE_PRICE, 0, addDays(t, -8), { item: 'freeze', freezes: 1 });
  const profiles = [
    { person_id: A, avatar: '🦊', frame: 'none', confetti: 'classic' },
    { person_id: L, avatar: '🦉', frame: 'none', confetti: 'classic' },
    { person_id: H, avatar: '🦖', frame: 'none', confetti: 'classic' },
    { person_id: V, avatar: '🦄', frame: 'rainbow', confetti: 'classic' },
  ];
  return { people, habits, logs, ledger, profiles };
}

// ================= habit maths =================
function isDueRaw(h, day) {
  const w = dow(day);
  switch (h.freq_type) {
    case 'weekdays': return w >= 1 && w <= 5;

}

const isFrozen = (pid, day) => !!S.frozen[pid]?.has(day);

function habitStreak(h) {
  const t = today();
  if (h.freq_type === 'weekly') {
    let ws = weekStart(t), n = weekDone(h, ws) >= h.freq_per_week ? 1 : 0;
    for (ws = addDays(ws, -7); ws >= S.since && weekDone(h, ws) >= h.freq_per_week; ws = addDays(ws, -7)) n++;
    return n;
  }
  let n = isDone(h, t) ? 1 : 0;
  for (let d = addDays(t, -1); d >= S.since; d = addDays(d, -1)) {
    if (!isDueRaw(h, d)) continue;
    if (isDone(h, d)) n++;

  }
  return n;
}
function habitBest(h) {

      if (weekDone(h, ws) >= h.freq_per_week) best = Math.max(best, ++run);
      else if (ws !== weekStart(t)) run = 0;
    }
    return best;
  }
  for (let d = S.since; d <= t; d = addDays(d, 1)) {
    if (!isDueRaw(h, d)) continue;

    else if (!isFrozen(h.person_id, d) && d !== t) run = 0;
  }

}
function habitDays(h) { let n = 0; for (const [k, c] of S.logMap) if (c >= h.target && k.startsWith(h.id + '|')) n++; return n; }

function personStreak(pid) {
  const t = today(), act = S.active[pid] || new Set();
  const doneToday = act.has(t);
  let d = doneToday ? t : addDays(t, -1), n = 0;
  // a frozen day keeps the streak alive but doesn't add to it

}

}

}
function stats(pid, ctx = {}) {

  for (const [k, c] of S.logMap) { const [hid] = k.split('|'); if (hs.has(hid) && c >= S.habitById.get(hid).target) checks++; }

}

  S.ledger.push(row); S.keyMap.set(pid + '|' + key, row); applyLocal(row, 1);

// Streak freezes: when someone missed day(s), spend freezes (if they have enough) to cover
// the gap so the streak survives. Keyed per day, so two phones doing this at once is harmless.
async function applyFreezes() {
  const t = today(), notices = [];
  for (const p of S.people) {
    const have = tot(p.id).freezes; if (have <= 0) continue;
    const act = S.active[p.id] || new Set();
    let last = null;
    for (let d = addDays(t, -1), i = 0; i < 60; i++, d = addDays(d, -1)) if (act.has(d) || isFrozen(p.id, d)) { last = d; break; }
    if (!last) continue;
    const gap = []; for (let d = addDays(last, 1); d < t; d = addDays(d, 1)) gap.push(d);
    if (!gap.length || gap.length > have) continue;
    for (const d of gap) await award(p.id, 'freeze_use:' + d, 'freeze_use', 0, 0, { freezes: -1, day: d });
    notices.push({ pid: p.id, used: gap.length });
  }
  return notices;
}

function habitRow(h, day) {
  const c = logCount(h.id, day), done = c >= h.target, st = habitStreak(h);
  const weekly = h.freq_type === 'weekly' ? `<span>${weekDone(h, weekStart(day))}/${h.freq_per_week} this week</span>` : `<span>${freqLabel(h)}</span>`;
  const multi = h.target > 1;
  return `<div class="habit ${done ? 'done' : c ? 'part' : ''}" style="--c:${h.color}" data-hid="${h.id}">
    <span class="ic">${esc(h.icon)}</span>
    <div class="info" data-edit="${h.id}"><div class="nm">${esc(h.name)}</div><div class="sub">${weekly}${st ? `<span class="st">🔥 ${st}</span>` : ''}${multi ? `<span>${c}/${h.target}</span>` : ''}</div></div>
    ${multi && c > 0 ? `<button class="minus" data-minus="${h.id}" aria-label="Undo one">−</button>` : ''}
    <button class="chk" data-check="${h.id}" aria-label="Check off ${esc(h.name)}">
      ${multi && !done ? `${ringSvg(62, 4, c / h.target, h.color, 'transparent').replace('<svg', '<svg class="ring"')}<span class="cnt">${c ? c + '/' + h.target : ''}</span>${c ? '' : '<svg class="tick"><use href="#i-tick"/></svg>'}` : '<svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
    </button>
  </div>`;
}
function habitCard(h) {
  const ws = d => weekDone(h, weekStart(d)) >= h.freq_per_week;
  return `<div class="hcard" data-edit="${h.id}">
    <div class="hd"><span class="e">${esc(h.icon)}</span><b>${esc(h.name)}</b><span class="tag">${esc(freqLabel(h))}</span></div>
    <div class="stats"><span>🔥 <b>${habitStreak(h)}</b> streak</span><span>🏆 <b>${habitBest(h)}</b> best</span><span>✅ <b>${habitDays(h)}</b> days</span></div>
    ${grid(d => {
      const c = logCount(h.id, d), due = isDueRaw(h, d), frz = isFrozen(h.person_id, d);
      return {
        v: c ? Math.min(1, c / h.target) : 0,
        nd: !due && !c,
        frz: frz && due && !c,
        on: c >= h.target,
        // days that don't break this habit's streak line
        skip: h.freq_type === 'weekly' ? ws(d) : (!due || frz),
      };
    }, h.color)}
  </div>`;
}
function reorderRow(h, i, n) {
  return `<div class="hcard reo" data-hrow="${h.id}">
    <div class="hd"><span class="e">${esc(h.icon)}</span><b>${esc(h.name)}</b></div>
    <button class="rbtn" data-move="${h.id}:-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
    <button class="rbtn" data-move="${h.id}:1" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
  </div>`;
}

// How much of a person's day got done: 0..1, or null when nothing was due.
// Each habit counts as a fraction, so 1 of 2 brushes = half a habit.
function dayScore(pid, d) {
  const hs = S.habits.filter(h => h.person_id === pid && localDay(h.created_at) <= d && (!h.archived || logCount(h.id, d)));
  const due = hs.filter(h => h.freq_type !== 'weekly' && isDueRaw(h, d));
  let got = 0;
  for (const h of due) got += Math.min(1, logCount(h.id, d) / h.target);
  const weeklyDone = hs.some(h => h.freq_type === 'weekly' && logCount(h.id, d));
  if (!due.length) return weeklyDone ? 1 : (S.active[pid]?.has(d) ? 1 : null);
  if (weeklyDone) got = Math.min(due.length, got + .5);
  return got / due.length;
}
function overallCard(pid, compact) {
  const t = today();
  let perfect = 0, sum = 0, n = 0;
  for (let i = 0; i < 30; i++) { const v = dayScore(pid, addDays(t, -i)); if (v == null) continue; n++; sum += v; if (v >= 1) perfect++; }
  const st = personStreak(pid);
  const sw = [.15, .45, .75, .99].map(v => `<i style="background:${rampColor('#2563eb', v)};opacity:${rampAlpha(v)}"></i>`).join('') + `<i style="background:linear-gradient(#cffafe,#22d3ee);box-shadow:0 0 6px #22d3ee"></i>`;
  return `<div class="card overall">
    ${compact ? '' : `<div class="hd" style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px"><span>🌈</span>All habits</div>`}
    <div class="stats"><span>🔥 <b>${st.n}</b> streak</span><span>🌟 <b>${perfect}</b> perfect</span><span>📈 <b>${n ? Math.round(sum / n * 100) : 0}%</b> last 30d</span></div>
    ${grid(d => { const v = dayScore(pid, d), act = S.active[pid]?.has(d), frz = isFrozen(pid, d);
      return { v: v || 0, nd: v == null && !frz, frz: frz && !act, on: !!act, skip: frz }; }, '#22d3ee', true)}
    <div class="legend">Less ${sw} 100%</div>
  </div>`;
}

// colour helpers: low days lean faded/darker, full days go bright
function mixHex(a, b, t) {
  const p = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const rampAlpha = v => (.3 + .55 * v).toFixed(2);
function rampColor(color, v, overall) {
  // overall board: deep blue -> cyan (like a glowing bar); habit boards: dim -> full habit colour
  return overall ? mixHex('#1d4ed8', '#22d3ee', v) : mixHex(mixHex(color, '#0b1120', .35), color, v);
}

// One SVG per board so the squares scale cleanly at any width.
// cellFn(day) -> { v: 0..1, nd: not due, frz: frozen }
let gridN = 0;
function grid(cellFn, color, overall = false) {
  const W = 26, C = 10, G = 3, P = C + G, TOP = 15, t = today(), start = addDays(weekStart(t), -7 * (W - 1));
  const id = 'gg' + (++gridN);
  const bright = overall ? '#cffafe' : mixHex(color, '#ffffff', .55);
  const xy = i => [Math.floor(i / 7) * P, TOP + (i % 7) * P];
  let labels = '', base = '', full = '', today_ = '';
  for (let w = 0; w < W; w++) {
    const wd = parse(addDays(start, 7 * w));
    if (wd.getDate() <= 7 && w < W - 2) labels += `<text x="${w * P}" y="10">${MONTHS[wd.getMonth()]}</text>`;
  }
  for (let i = 0; i < W * 7; i++) {
    const d = addDays(start, i); if (d > t) break;
    const c = cellFn(d), [x, y] = xy(i);
    const r = `x="${x}" y="${y}" width="${C}" height="${C}" rx="2.5"`;
    if (c.v >= 1) full += `<rect ${r} fill="url(#${id})"/>`;
    else if (c.v > 0) base += `<rect ${r} fill="${rampColor(color, c.v, overall)}" fill-opacity="${rampAlpha(c.v)}"/>`;
    else base += `<rect ${r} fill="${c.frz ? '#7dd3fc' : c.nd ? '#1a2438' : '#243049'}"${c.frz ? ' fill-opacity=".35"' : ''}/>`;
    if (d === t) today_ = `<rect x="${x - 1}" y="${y - 1}" width="${C + 2}" height="${C + 2}" rx="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>`;
  }
  return `<svg class="grid" viewBox="-1 0 ${W * P - G + 2} ${TOP + 7 * P - G + 1}" role="img" aria-label="Completion grid">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bright}"/><stop offset="1" stop-color="${overall ? '#22d3ee' : color}"/></linearGradient></defs>
    ${labels}${base}<g filter="url(#glow)">${full}</g>${today_}</svg>`;
}
function familyQuest() {
  const t = today(), ws = weekStart(t);
  let expected = 0, done = 0;
  for (const h of S.habits) {
    if (h.archived) continue;
    if (h.freq_type === 'weekly') expected += h.freq_per_week;
    else for (let i = 0; i < 7; i++) if (isDueRaw(h, addDays(ws, i))) expected++;
  }
  for (const h of S.habits) for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= t && isDone(h, d)) done++; }
  return { target: Math.max(10, Math.round(expected * .7 / 5) * 5), done, week: ws };
}

// ================= the big one: ticking a habit =================
async function setCount(h, day, nw, btn) {
  const pid = h.person_id, t = today(), old = logCount(h.id, day);
  if (nw === old) return;
  const r = btn ? btn.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const before = { streak: personStreak(pid), lvl: levelOf(tot(pid).xp) };
  if (nw > 0) S.logMap.set(h.id + '|' + day, nw); else S.logMap.delete(h.id + '|' + day);
  reindex();
  S.api.setLog(h, day, nw).catch(saveFailed);

  const wasDone = old >= h.target, nowDone = nw >= h.target, up = nw > old;
  if (up) { const cb = bumpCombo(); sfx.check(cb); buzz(12); burst(cx, cy, h.color, nowDone ? 22 : 10); if (cb >= 2 && nowDone) comboText(cb); }
  else { sfx.undo(); buzz(6); }

  if (day === t) {
    if (!wasDone && nowDone) {
      const hs = habitStreak(h), bonus = clamp(hs - 1, 0, 10);
      award(pid, `check:${h.id}:${day}`, 'check', GEMS_PER_HABIT + bonus, XP_PER_HABIT, { day });
      flyGems(cx, cy, GEMS_PER_HABIT + bonus);
      floatText(cx, cy - 30, `+${XP_PER_HABIT} XP`, '#c084fc');
      if (bonus) setTimeout(() => floatText(cx - 60, cy - 10, `🔥 +${bonus} streak bonus`, '#fdba74'), 250);
    } else if (wasDone && !nowDone) {
      unaward(pid, `check:${h.id}:${day}`);
    }
  }
  render();
  if (up) {
    const row = document.querySelector(`.habit[data-hid="${h.id}"]`);
    if (row) { row.classList.add('pop'); }
    bumpPill('pill-gems');
  }
  if (!up) return;

  // --- follow-on rewards (only for today) ---
  const gemsBefore = tot(pid).gems;
  const after = personStreak(pid);
  if (day === t && !before.streak.doneToday && after.doneToday) {
    bumpPill('pill-fire');
    const ms = MILESTONES.find(([n]) => n === after.n);
    let msGems = 0;
    if (ms && await award(pid, `ms:${ms[0]}:${after.start}`, 'milestone', ms[1], 0)) msGems = ms[1];
    celebrate(() => streakModal(pid, after.n, msGems));
  } else if (day !== t) {
    // back-filling can join two streaks together — just refresh the flame
  }
  if (day === t && isPerfect(pid, t) && !hasKey(pid, 'perfect:' + t)) {
    if (await award(pid, 'perfect:' + t, 'perfect', PERFECT_GEMS, PERFECT_XP)) {
      celebrate(() => perfectModal(pid));
      const everyone = S.people.filter(p => dueToday(p.id, t).some(h => h.freq_type !== 'weekly'));
      if (everyone.length > 1 && everyone.every(p => hasKey(p.id, 'perfect:' + t)))
        for (const p of everyone) await checkBadges(p.id, { team: true });
    }
  }
  const lvl = levelOf(tot(pid).xp);
  if (lvl > before.lvl) for (let n = before.lvl + 1; n <= lvl; n++) {
    if (await award(pid, 'level:' + n, 'level', n * 10, 0)) celebrate(() => levelModal(pid, n));
  }
  const hr = new Date().getHours();
  if (day === t) await checkBadges(pid, { early: hr < 8, owl: hr >= 21 });
  await checkQuest();
  if (tot(pid).gems !== gemsBefore) render();
}

async function checkBadges(pid, ctx = {}) {
  const s = stats(pid, ctx);
  for (const b of BADGES) {

// Swap a habit with its neighbour in this person's list, then renumber everyone's `sort`
// so the order is identical on every phone.
function moveHabit(hid, dir) {
  const h = S.habitById.get(hid); if (!h) return;
  const list = S.habits.filter(x => x.person_id === h.person_id && !x.archived);
  const i = list.indexOf(h), j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const changed = [];
  list.forEach((x, k) => { if (x.sort !== k) { x.sort = k; changed.push(x); } });
  S.habits.sort((a, b) => a.sort - b.sort || String(a.created_at).localeCompare(String(b.created_at)));
  reindex(); sfx.pop(); buzz(8); render();
  document.querySelector(`[data-hrow="${hid}"]`)?.classList.add('moved');
  if (changed.length) S.api.saveHabits(changed).catch(saveFailed);
}
async function saveHabit(h, existing) {
  const row = { id: h.id, person_id: h.person_id, name: h.name.slice(0, 80), icon: h.icon, color: safeColor(h.color), freq_type: h.freq_type, freq_days: h.freq_days, freq_per_week: h.freq_per_week, target: h.target, description: h.description, archived: h.archived, sort: h.sort, created_at: h.created_at };
  if (existing && existing.person_id !== h.person_id) {
    // moving a habit to someone else: logs belong to the old owner, so start fresh
    for (const k of [...S.logMap.keys()]) if (k.startsWith(h.id + '|')) S.logMap.delete(k);
    await S.api.deleteHabit(h.id).catch(saveFailed);
    row.id = h.id = uuid(); row.created_at = new Date().toISOString();
    S.habits = S.habits.filter(x => x.id !== existing.id);
  }
  const i = S.habits.findIndex(x => x.id === row.id);
  if (i >= 0) S.habits[i] = row; else S.habits.push(row);
  reindex(); render();
  try { await S.api.saveHabit(row); } catch (e) { saveFailed(e); }
}

    if (tot(pid).gems < it.p) { sfx.undo(); toast('💎', `You need ${it.p - tot(pid).gems} more gems. Keep going!`); return; }
    const preview = kind === 'avatar' ? it.e : kind === 'frame' ? `<span class="av lg f-${esc(it.id)} emo" style="--c:${safeColor(person(pid)?.color)}">${esc(pr.avatar || '🙂')}</span>` : it.e;
    const ok = await modal(`<div class="hero">${preview}</div><h1>${esc(it.n || 'New avatar')}</h1><p>Buy this for <b style="color:var(--gem)">💎 ${it.p}</b>?</p><div style="display:flex;gap:10px"><button class="btn block" data-close>Not now</button><button class="btn primary block" data-close="y">Buy</button></div>`);
    if (ok !== 'y') return;
    if (!await award(pid, 'buy:' + id, 'buy', -it.p, 0, { item: id })) return;
    sfx.coin(); sfx.fanfare(); confetti(pid, false); toast('🛍️', 'Purchased!');
    await checkBadges(pid);
  }
  if (kind === 'avatar') pr.avatar = it.e; else if (kind === 'frame') pr.frame = id; else { pr.confetti = id; setTimeout(() => confetti(pid, false), 150); }
  S.profiles[pid] = pr; render();
  S.api.saveProfile({ person_id: pid, avatar: pr.avatar, frame: pr.frame, confetti: pr.confetti }).catch(saveFailed);
}
async function buyFreeze() {
  const pid = S.pid, t = tot(pid);
  if (t.freezes >= MAX_FREEZES || t.gems < FREEZE_PRICE) return;
  if (await award(pid, 'buy:freeze:' + uuid(), 'buy', -FREEZE_PRICE, 0, { item: 'freeze', freezes: 1 })) {
    sfx.coin(); buzz(15); toast('🧊', 'Streak freeze equipped! Your streak is protected.'); await checkBadges(pid); render();
  }
}

// ================= events =================
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-edit], [data-person]'); if (!el || el.closest('.sheet, .modal, .who')) return;
  ac();   // unlock audio on first tap (iOS)
  const d = el.dataset;
  if (d.tab) { if (d.tab !== S.tab) { S.tab = d.tab; S.reorder = false; S.enter = true; if (d.tab === 'today') S.selDay = today(); render(); scrollTo(0, 0); buzz(5); } return; }
  if (d.day) { if (d.day > today()) { toast('🔮', 'No peeking into the future!'); return; } S.selDay = d.day; render(); return; }
  if (d.check) {
    const h = S.habitById.get(d.check), c = logCount(h.id, S.selDay);
    if (h.target === 1) return setCount(h, S.selDay, c ? 0 : 1, el);
    if (c >= h.target) { el.closest('.habit').classList.add('wiggle'); setTimeout(() => el.closest('.habit')?.classList.remove('wiggle'), 400); toast('✅', 'Done for today! Tap − to undo one.'); return; }
    return setCount(h, S.selDay, c + 1, el);
  }
  if (d.minus) { const h = S.habitById.get(d.minus); return setCount(h, S.selDay, Math.max(0, logCount(h.id, S.selDay) - 1), el); }
  if (d.move) { const [hid, dir] = d.move.split(':'); return moveHabit(hid, +dir); }
  if (d.edit && !S.reorder) return habitForm(S.habitById.get(d.edit));
  if (d.person) { if (d.person !== S.pid) { delete shown['n-gems']; choosePerson(d.person); } return; }
  if (d.buy) { const [k, id] = d.buy.split(':'); return buy(k, id); }
  if (d.badge) { const b = BADGES.find(x => x.id === d.badge), got = hasKey(S.pid, 'badge:' + b.id); return modal(`<div class="hero" style="${got ? '' : 'filter:grayscale(1) brightness(.6)'}">${b.e}</div><h1>${esc(b.n)}</h1><p>${esc(b.d)}</p><div class="reward">${got ? '✓ Earned' : 'Reward'} · ${b.g} 💎</div><br><button class="btn block" data-close>Close</button>`); }
  switch (d.act) {
    case 'switch': return switchSheet();
    case 'reorder': S.reorder = !S.reorder; buzz(5); render(); return;
    case 'new-habit': return habitForm(null);
    case 'chest': return openChest();
    case 'buy-freeze': return buyFreeze();
    case 'add-person': return addPersonSheet();
    case 'sound': LS.set('hq.sound', !soundOn()); render(); if (soundOn()) sfx.coin(); return;
    case 'refresh': await refresh(true); toast('🔄', 'Up to date'); return;
    case 'signout':
      if (S.api === Demo) { LS.del('hq.mode'); LS.del('hq.person'); location.reload(); return; }
      await S.api.signOut(); LS.del('hq.person'); location.reload(); return;
  }
});

// ================= boot / auth =================
function screen(html) { $('#app').innerHTML = `<div class="center">${html}</div>`; }
function loginScreen(err = '') {
  screen(`<div class="logo">💎</div><h1 class="brand">Habit Quest</h1>
    <p class="muted" style="text-align:center;margin:0 0 10px">Build habits together. Earn gems. Keep the streak alive. 🔥</p>
    ${err ? `<div class="err-box">${esc(err)}</div>` : ''}
    <form id="login" style="display:flex;flex-direction:column;gap:10px">
      <input id="email" type="email" autocomplete="username" placeholder="Email (your Board login)" required>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
    <p class="small muted" style="text-align:center;margin:4px 0">Use the same email and password as The Board. Kids can use a parent’s login on their device, then pick their own profile.</p>
    <button class="btn block" id="demo">🎮 Try the demo first</button>`);
  if (!sb) $('#login').insertAdjacentHTML('beforebegin', '<div class="err-box">Couldn’t load the sign-in library. Check your connection and reload.</div>');
  $('#login').onsubmit = async e => {
    e.preventDefault(); if (!sb) return;
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Signing in…';
    try { await Remote.signIn($('#email').value.trim(), $('#pw').value); LS.del('hq.mode'); S.api = Remote; start(); }
    catch (er) { loginScreen(er.message || 'Sign-in failed'); }
  };
  $('#demo').onclick = () => { LS.set('hq.mode', 'demo'); S.api = Demo; start(); };
}
async function refresh(quiet) {
  const d = await S.api.load(addDays(today(), -HISTORY_DAYS), addDays(today(), -14));
  if (d.signedOut) return loginScreen();
  ingest(d);
  if (!person(S.pid)) S.pid = null;
  if (S.pid) { if (S.selDay > today()) S.selDay = today(); render(); }
  return d;
}
async function start() {
  screen(`<div class="logo">💎</div><div class="spinner"></div><p class="muted" style="text-align:center">Loading your quest…</p>`);
  let d;
  try { d = await S.api.load(addDays(today(), -HISTORY_DAYS), addDays(today(), -14)); }
  catch (e) {
    console.error(e);
    if (tableMissing(e)) return screen(`<div class="logo">🛠️</div><h1 class="brand" style="font-size:26px">One-time setup needed</h1><p class="muted" style="text-align:center">The database doesn’t have Habit Quest’s tables yet. Run <b>setup-habit-quest.sql</b> in Supabase → SQL Editor, then reload this page.</p><button class="btn primary block" onclick="location.reload()">Reload</button>`);
    return screen(`<div class="logo">😵</div><div class="err-box">Couldn’t load: ${esc(e.message || e)}</div><button class="btn primary block" onclick="location.reload()">Try again</button><button class="btn block" id="so">Sign out</button>`), ($('#so').onclick = async () => { await S.api.signOut(); LS.del('hq.mode'); location.reload(); });
  }
  if (d.signedOut) return loginScreen();
  if (d.noHousehold) return screen(`<div class="logo">🏠</div><p style="text-align:center">This login isn’t part of a family yet. Open <b>The Board</b>, create or join your household there, then come back.</p><button class="btn block" onclick="location.reload()">Reload</button>`);
  ingest(d);
  S.notices = await applyFreezes();
  if (!S.people.length) { screen(`<div class="logo">👋</div><h1 class="brand" style="font-size:26px">Add your family</h1><p class="muted" style="text-align:center">Start by adding the first person.</p><button class="btn green block" id="ap">Add family member</button>`); $('#ap').onclick = addPersonSheet; return; }
  const saved = LS.get('hq.person', null);   // this device remembers who was playing
  if (saved && person(saved)) choosePerson(saved);
  else whoIsPlaying();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.pid && Date.now() - S.loadedAt > 60000) refresh(true).catch(console.error);
});
// pull-to-refresh-ish: a new day while the app is left open
setInterval(() => { if (S.pid && S.selDay !== today() && S.tab === 'today' && document.visibilityState === 'visible' && Date.now() - S.loadedAt > 3600000) refresh(true).catch(console.error); }, 60000);

(async function boot() {
  if (LS.get('hq.mode', null) === 'demo') { S.api = Demo; return start(); }
  if (!sb) return loginScreen();
  S.api = Remote;
  try { if (await Remote.session()) return start(); } catch (e) { console.error(e); }
  loginScreen();
})();

})();
</script>
</body>
